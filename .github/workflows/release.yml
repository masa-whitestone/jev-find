# v* タグを push すると、各プラットフォーム向けのバイナリをビルドして GitHub Release に載せる
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          cp "target/${{ matrix.target }}/release/jfd" "jfd-${{ matrix.target }}"
          shasum -a 256 "jfd-${{ matrix.target }}" > "jfd-${{ matrix.target }}.sha256"
      - run: gh release upload "$GITHUB_REF_NAME" "jfd-${{ matrix.target }}" "jfd-${{ matrix.target }}.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
